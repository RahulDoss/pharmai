<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pharma AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
<script src="https://unpkg.com/ngl"></script>

<style>
body { background:black; color:white; font-family:monospace; }
.viewer { height:420px; border:1px solid #333; border-radius:10px; }
.card { border:1px solid #333; padding:10px; margin-top:10px; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useRef} = React;

const API_URL = "https://pharmai-vgau.onrender.com";

function Viewer({data}){

  const molRef = useRef();
  const protRef = useRef();

  useEffect(()=>{

    if(!data) return;

    if(data.type==="protein" && protRef.current){
      const stage = new NGL.Stage(protRef.current);
      stage.loadFile(`rcsb://${data.pdb_id}`).then(c=>{
        c.addRepresentation("cartoon",{colorScheme:"chainname"});
        c.autoView();
      });
    }

    if(data.type==="molecule" && molRef.current){
      const viewer = $3Dmol.createViewer(molRef.current,{backgroundColor:"black"});

      fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/smiles/${data.smiles}/SDF`)
      .then(r=>r.text())
      .then(sdf=>{
        viewer.addModel(sdf,"sdf");
        viewer.setStyle({stick:{radius:0.2}});
        viewer.zoomTo();
        viewer.spin(true);
        viewer.render();
      });
    }

  },[data]);

  return (
    <div>
      {data?.type==="protein" && <div className="viewer" ref={protRef}></div>}
      {data?.type==="molecule" && <div className="viewer" ref={molRef}></div>}
    </div>
  );
}

function App(){

  const [q,setQ] = useState("");
  const [data,setData] = useState(null);
  const [loading,setLoading] = useState(false);

  const run = async()=>{
    setLoading(true);
    const r = await fetch(`${API_URL}/analyze?q=${q}`);
    const d = await r.json();
    setData(d);
    setLoading(false);
  };

  return (
    <div style={{padding:20}}>

      <h2>🧬 Pharma AI</h2>

      <input value={q} onChange={e=>setQ(e.target.value)} />
      <button onClick={run}>Analyze</button>

      {loading && <p>Loading...</p>}

      {data && <Viewer data={data}/>}

      {data && (
        <div className="card">
          <div>💊 Score: {data.drug_likeness_score}</div>
          <div>🧪 Similarity: {data.similarity_score}</div>
          <div>📘 {String(data.explanation)}</div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
