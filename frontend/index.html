    <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bio AI Explorer</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- 3D libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
<script src="https://unpkg.com/ngl@2.0.0-dev.39/dist/ngl.js"></script>

<style>
body { background:#000; color:white; font-family:monospace; }
.viewer {
  height:450px;
  border:1px solid #333;
  border-radius:12px;
  margin-top:10px;
}
.card {
  border:1px solid #333;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}
input {
  padding:10px;
  width:300px;
  border-radius:8px;
  color:black;
}
button {
  padding:10px 15px;
  margin-left:10px;
  border-radius:8px;
  background:#22c55e;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useRef} = React;

const API_URL = "https://pharmai-vgau.onrender.com";

/* ---------------- VIEWER ---------------- */
function Viewer({data}) {

  const molRef = useRef(null);
  const protRef = useRef(null);

  useEffect(() => {
    if (!data) return;

    /* ================= PROTEIN (RIBBON VIEW) ================= */
    if (data.type === "protein" && protRef.current) {

      protRef.current.innerHTML = "";

      const stage = new NGL.Stage(protRef.current);

      stage.loadFile(`rcsb://${data.structure.pdb_id}`).then(comp => {
        comp.addRepresentation("cartoon", {
          colorScheme: "chainname"
        });
        comp.addRepresentation("ball+stick", {
          sele: "hetero"
        });
        comp.autoView();
      });

      // enable zoom + rotate
      stage.setParameters({ backgroundColor: "black" });
    }

    /* ================= MOLECULE / DRUG ================= */
    if ((data.type === "drug" || data.type === "molecule") && molRef.current) {

      molRef.current.innerHTML = "";

      const viewer = $3Dmol.createViewer(molRef.current, {
        backgroundColor: "black"
      });

      const smiles = data.pubchem?.smiles;

      if (!smiles) return;

      // FIX: correct PubChem SDF API
      fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/smiles/${encodeURIComponent(smiles)}/SDF`)
        .then(res => res.text())
        .then(sdf => {

          viewer.addModel(sdf, "sdf");

          viewer.setStyle({}, {
            stick: { radius: 0.25 },
            sphere: { scale: 0.25 }
          });

          viewer.zoomTo();
          viewer.spin(true);   // 360° auto rotation
          viewer.render();
        });
    }

  }, [data]);

  return (
    <div>
      {data?.structure && (
        <div className="viewer" ref={protRef}></div>
      )}

      {data?.pubchem && (
        <div className="viewer" ref={molRef}></div>
      )}
    </div>
  );
}

/* ---------------- APP ---------------- */
function App() {

  const [q, setQ] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);

  const run = async () => {
    setLoading(true);

    const res = await fetch(`${API_URL}/discover?q=${encodeURIComponent(q)}`);
    const json = await res.json();

    setData(json);
    setLoading(false);
  };

  return (
    <div style={{padding:20}}>

      <h1 style={{fontSize:24}}>🧬 Bio AI Drug Explorer</h1>

      <div style={{marginTop:10}}>
        <input
          value={q}
          onChange={e => setQ(e.target.value)}
          placeholder="Try: aspirin / malaria / covid / diabetes"
        />
        <button onClick={run}>Analyze</button>
      </div>

      {loading && <p>Loading...</p>}

      {/* 3D VIEWER */}
      {data && <Viewer data={data} />}

      {/* INFO PANEL */}
      {data && (
        <div className="card">

          <div>🧠 Type: {data.type}</div>

          {data.cid && <div>💊 CID: {data.cid}</div>}

          {data.explanation && (
            <div style={{marginTop:10}}>
              📘 {data.explanation}
            </div>
          )}

          {data.type === "disease" && (
            <div style={{marginTop:10}}>
              🦠 Disease Mode (no molecule structure)
            </div>
          )}

        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
